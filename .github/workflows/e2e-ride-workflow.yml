# Executes the ride workflow from WORKFLOW.md against a real MySQL and Redis.
#
# This is a smoke workflow, not a unit test suite: no JUnit, Mockito or
# Testcontainers is added to the build. It drives the running application over
# HTTP exactly as a client would, so it catches the things a unit test cannot -
# Flyway migrations, JPA mappings, the security filter chain and Redis GEO.
name: E2E Ride Workflow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: Book, start and complete a ride
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          # Ephemeral throwaway container, reachable only from this job.
          # Real credentials belong in secrets, never in a workflow file.
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ridehailing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=15

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=3s --health-retries=10

    env:
      BASE: http://localhost:8080/api/v1
      DB_USERNAME: ridehailing
      DB_PASSWORD: ridehailing
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Grant the application user access to every module schema
        run: |
          # The application owns eight schemas and Flyway creates them at
          # startup, so a grant scoped to one database is not enough.
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE USER IF NOT EXISTS 'ridehailing'@'%' IDENTIFIED BY 'ridehailing';
            GRANT ALL PRIVILEGES ON *.* TO 'ridehailing'@'%';
            FLUSH PRIVILEGES;"

      - name: Build
        run: ./mvnw -B -q clean package -DskipTests

      - name: Start the application
        run: |
          nohup java -jar target/ridehailing-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          echo "waiting for the application to accept requests..."
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/configurations" || true)
            # 401 means the security chain answered: the app is up.
            if [ "$CODE" != "000" ]; then
              echo "up after ${i} attempts (HTTP $CODE)"; exit 0
            fi
            sleep 5
          done
          echo "application did not start in time"; tail -100 app.log; exit 1

      - name: Verify Flyway applied every migration
        run: |
          COUNT=$(mysql -h 127.0.0.1 -uroot -proot -N -B -e \
            "SELECT COUNT(*) FROM ridehailing.flyway_schema_history WHERE success = 1;")
          echo "applied migrations: $COUNT"
          # Fifteen versioned migrations must all be green.
          [ "$COUNT" -ge 15 ] || { echo "expected at least 15"; exit 1; }
          mysql -h 127.0.0.1 -uroot -proot -e "SHOW DATABASES LIKE '%\_schema';"

      - name: Run the end-to-end ride workflow
        run: ./scripts/e2e-ride-workflow.sh

      - name: Application log
        if: always()
        run: tail -200 app.log

      - name: Upload application log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: app.log
          retention-days: 7
