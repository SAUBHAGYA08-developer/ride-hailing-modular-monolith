server:
  # PORT is injected by the host platform and wins; SERVER_PORT stays for local overrides.
  port: ${PORT:${SERVER_PORT:10000}}
  tomcat:
    threads:
      # 200 idle thread stacks are pure waste on a small container; lower it there.
      max: ${TOMCAT_MAX_THREADS:25}
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: ridehailing

  datasource:
    # DB_URL overrides wholesale: a hosted MySQL needs its own SSL and pooling parameters.
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ridehailing}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      pool-name: ridehailing-pool
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000

  jpa:
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    hibernate:
      # Flyway is the single source of truth for schema. Hibernate never touches DDL.
      # Do not set this to update: Hibernate cannot create the module schemas
      # (it never issues CREATE DATABASE), and silently adding columns no
      # migration knows about drifts this database away from every other one.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 30
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${DB_NAME:ridehailing}
    default-schema: ${DB_NAME:ridehailing}
    create-schemas: true
    baseline-on-migrate: false
    validate-on-migrate: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: ${REDIS_TIMEOUT:10s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:10s}
      lettuce:
        pool:
          enabled: true
          max-active: ${REDIS_POOL_MAX:4}
          max-idle: ${REDIS_POOL_MAX_IDLE:2}
          min-idle: ${REDIS_POOL_MIN_IDLE:1}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  # Comma separated origins for a browser app served from another host; empty permits none.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    # Technical configuration - NEVER stored in the database.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    issuer: ridehailing
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  cache:
    configuration-ttl-seconds: ${CONFIG_CACHE_TTL:300}
  booking:
    max-candidates: 20

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"
  level:
    com.ridehailing: ${LOG_LEVEL:INFO}
